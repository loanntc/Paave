name: Paave ETL — Supabase ingestion

on:
  # Hourly at xx:03 to avoid 00:00 quota spikes
  schedule:
    - cron: '3 * * * *'
  # Manual trigger — choose the group
  workflow_dispatch:
    inputs:
      group:
        description: 'Which schedule group to run'
        required: true
        default: 'hourly'
        type: choice
        options: [hourly, daily, manual]
      dry_run:
        description: 'Dry-run (no writes)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      only:
        description: 'Optional: space-separated endpoint keys (e.g. "market.quote_latest news.latest")'
        required: false
        default: ''
        type: string

# Prevent overlapping runs — if the previous hourly run is still going, skip.
concurrency:
  group: paave-etl-${{ github.event.inputs.group || 'hourly' }}
  cancel-in-progress: false

jobs:
  hourly:
    name: Hourly ETL
    if: github.event_name == 'schedule' || github.event.inputs.group == 'hourly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: supabase/etl/requirements.txt

      - name: Install deps
        run: pip install -r supabase/etl/requirements.txt

      - name: Run ETL (hourly)
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAAVE_API_BASE_URL:        ${{ secrets.PAAVE_API_BASE_URL }}
          PAAVE_SYSTEM_TOKEN:        ${{ secrets.PAAVE_SYSTEM_TOKEN }}
          ETL_LOG_LEVEL:             INFO
        run: |
          EXTRA=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then EXTRA="$EXTRA --dry-run"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then EXTRA="$EXTRA --only ${{ github.event.inputs.only }}"; fi
          python -m supabase.etl.sync --group hourly $EXTRA

  daily:
    name: Daily ETL (post-VN close, 18:30 ICT)
    # Runs only when manually dispatched with group=daily OR a second schedule below
    if: github.event.inputs.group == 'daily'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: supabase/etl/requirements.txt

      - name: Install deps
        run: pip install -r supabase/etl/requirements.txt

      - name: Run ETL (daily)
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAAVE_API_BASE_URL:        ${{ secrets.PAAVE_API_BASE_URL }}
          PAAVE_SYSTEM_TOKEN:        ${{ secrets.PAAVE_SYSTEM_TOKEN }}
        run: python -m supabase.etl.sync --group daily
