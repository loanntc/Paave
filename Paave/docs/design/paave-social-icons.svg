<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paave — Social Login Icons
  Google · Apple · Facebook/Meta · Kakao
  Each icon: 64 × 64 px (scale freely)
-->
<svg width="400" height="180" viewBox="0 0 400 180"
     xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">

  <!-- ══════════════════════════════════════════════════════════════
       GOOGLE  (official 4-color G path data, centered in 64×64)
  ══════════════════════════════════════════════════════════════════ -->
  <g id="google" transform="translate(0,0)">
    <rect width="64" height="64" rx="14" fill="#FFFFFF"/>
    <g transform="translate(8,8)">
      <path d="M47.532 24.5528C47.532 22.9214 47.3997 21.2811 47.1175 19.6761H24.48V28.9181H37.4434C36.9055 31.8988 35.177 34.5356 32.6461 36.2111V42.2078H40.3801C44.9217 38.0278 47.532 31.8547 47.532 24.5528Z"
            fill="#4285F4"/>
      <path d="M24.48 48.0016C30.9529 48.0016 36.4116 45.8764 40.3888 42.2078L32.6549 36.2111C30.5031 37.675 27.7252 38.5039 24.4888 38.5039C18.2275 38.5039 12.9187 34.2798 11.0139 28.6006H3.03296V34.7825C7.10718 42.8868 15.4056 48.0016 24.48 48.0016Z"
            fill="#34A853"/>
      <path d="M11.0051 28.6006C9.99973 25.6199 9.99973 22.3922 11.0051 19.4115V13.2296H3.03298C-0.371021 20.0112 -0.371021 28.0009 3.03298 34.7825L11.0051 28.6006Z"
            fill="#FBBC04"/>
      <path d="M24.48 9.49932C27.9016 9.44641 31.2086 10.7334 33.6866 13.0973L40.5387 6.24523C36.2 2.17101 30.4414 -0.068932 24.48 0.00161733C15.4055 0.00161733 7.10718 5.11644 3.03296 13.2296L11.005 19.4115C12.901 13.7235 18.2187 9.49932 24.48 9.49932Z"
            fill="#EA4335"/>
    </g>
    <text x="32" y="88" text-anchor="middle"
          font-size="10" fill="#9CA3AF">Google</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       APPLE  (teardrop leaf + bitten body, white on black)
  ══════════════════════════════════════════════════════════════════ -->
  <g id="apple" transform="translate(96,0)">
    <rect width="64" height="64" rx="14" fill="#000000"/>
    <!-- Leaf -->
    <path d="M 37 18
             C 36 13, 39 8, 43 8
             C 43 13, 41 17, 37 18 Z"
          fill="#FFFFFF"/>
    <!-- Body -->
    <path d="M44,22
             C41,19 37,19.5 35,20
             C33,20.5 31,20 29,22
             C25,25 24,31 25,36
             C26,41 29,48 32,48
             C34,48 35,46.5 37,46.5
             C39,46.5 40,48 42,48
             C45,48 48,41 49,36
             C50,31 49,25 44,22 Z"
          fill="#FFFFFF"/>
    <text x="32" y="88" text-anchor="middle"
          font-size="10" fill="#9CA3AF">Apple</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       FACEBOOK / META  (lowercase f, white on brand blue)
  ══════════════════════════════════════════════════════════════════ -->
  <g id="meta" transform="translate(192,0)">
    <rect width="64" height="64" rx="14" fill="#1877F2"/>
    <path d="M36,12 C30,12 27,15 27,21 L27,28 L22,28 L22,36 L27,36 L27,52 L35,52 L35,36 L41,36 L42,28 L35,28 L35,22 C35,20 36,19 38,19 L42,19 L42,12 Z"
          fill="#FFFFFF"/>
    <text x="32" y="88" text-anchor="middle"
          font-size="10" fill="#9CA3AF">Meta</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       KAKAO  (brown speech bubble + yellow K, clean single paths)
  ══════════════════════════════════════════════════════════════════ -->
  <g id="kakao" transform="translate(288,0)">
    <rect width="64" height="64" rx="14" fill="#FEE500"/>
    <!-- Speech bubble body -->
    <ellipse cx="32" cy="30" rx="22" ry="18" fill="#3C1E1E"/>
    <!-- Tail -->
    <path d="M 22 44 L 18 52 L 29 46 Z" fill="#3C1E1E"/>
    <!-- K — left vertical bar -->
    <rect x="22" y="20" width="5" height="20" rx="1" fill="#FEE500"/>
    <!-- K — right legs (single path, no seam) -->
    <path d="M 27 30 L 37 20 L 42 20 L 32 30 L 42 40 L 37 40 Z"
          fill="#FEE500"/>
    <text x="32" y="88" text-anchor="middle"
          font-size="10" fill="#9CA3AF">Kakao</text>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       DARK BACKGROUND USAGE PREVIEW (y = 100)
  ══════════════════════════════════════════════════════════════════ -->
  <g transform="translate(0,100)">
    <rect width="400" height="64" rx="14" fill="#161B22"/>

    <rect x="8" y="8" width="84" height="48" rx="10" fill="#FFFFFF"/>
    <text x="50" y="37" text-anchor="middle"
          font-size="12" font-weight="600" fill="#374151">Google</text>

    <rect x="104" y="8" width="84" height="48" rx="10" fill="#000000"/>
    <text x="146" y="37" text-anchor="middle"
          font-size="12" font-weight="600" fill="#FFFFFF">Apple</text>

    <rect x="200" y="8" width="84" height="48" rx="10" fill="#1877F2"/>
    <text x="242" y="37" text-anchor="middle"
          font-size="12" font-weight="600" fill="#FFFFFF">Meta</text>

    <rect x="296" y="8" width="96" height="48" rx="10" fill="#FEE500"/>
    <text x="344" y="37" text-anchor="middle"
          font-size="12" font-weight="600" fill="#3C1E1E">Kakao</text>
  </g>

</svg>
