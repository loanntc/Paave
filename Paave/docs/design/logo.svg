<?xml version="1.0" encoding="UTF-8"?>
<!--
  PAAVE — Brand Logo
  Version: 1.0 | Date: 2026-04-17
  Designer: Graphic Design AI

  CONCEPT: "The Pave Mark"
  The P letterform encodes the brand's dual promise:
  — The vertical STEM = unwavering financial foundation
  — The bowl ARC = a rising chart curve, paving upward
  The gradient sweeps bottom-blue → top-cyan, mirroring
  a stock ticking from deep value into open sky.

  USAGE VARIANTS (in this file):
  A. Primary lockup — horizontal, dark background (main)
  B. App Icon       — square, dark, standalone mark
  C. Light lockup   — horizontal, white background
-->
<svg width="1200" height="720" viewBox="0 0 1200 720"
     xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <!-- ─── Brand Gradient: Electric Blue → Cyan ─── -->
    <!-- Direction: bottom-left to top-right (135°) -->
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wordmark gradient (horizontal, userSpace coords for A-section) -->
    <linearGradient id="wordGradDark" x1="580" y1="0" x2="920" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wordmark gradient for light lockup (C-section) -->
    <linearGradient id="wordGradLight" x1="80" y1="0" x2="420" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Tagline gradient for light section brand mark -->
    <linearGradient id="brandGradLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>

    <!-- Page background: deepest navy -->
    <linearGradient id="bgMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="100%" stop-color="#0D1520"/>
    </linearGradient>

    <!-- Ambient glow filter -->
    <filter id="ambientGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="28" result="blur"/>
    </filter>

    <!-- Tight glow behind P mark -->
    <filter id="markGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="18" result="blur"/>
    </filter>

    <!-- Card drop shadow (blue-tinted) -->
    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="28"
                    flood-color="#3B82F6" flood-opacity="0.22"/>
    </filter>

    <!-- Light card shadow (neutral) -->
    <filter id="lightShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="20"
                    flood-color="#0D1117" flood-opacity="0.12"/>
    </filter>

    <!-- Section divider clip -->
    <clipPath id="topHalf">
      <rect width="1200" height="480"/>
    </clipPath>
    <clipPath id="bottomHalf">
      <rect x="0" y="480" width="1200" height="240"/>
    </clipPath>
  </defs>


  <!-- ════════════════════════════════════════════════════════════════ -->
  <!--  SECTION A — PRIMARY LOCKUP (dark background)                   -->
  <!--  Canvas: 1200 × 480                                             -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Dark background -->
  <rect width="1200" height="480" fill="url(#bgMain)" clip-path="url(#topHalf)"/>

  <!-- Ambient blue glow (left, behind icon) -->
  <ellipse cx="230" cy="240" rx="200" ry="200"
           fill="#3B82F6" opacity="0.06" filter="url(#ambientGlow)"/>

  <!-- Background sparkline: ghost of a rising stock chart -->
  <!-- Runs across the right two-thirds — very subtle, adds depth -->
  <polyline
    points="520,440 620,370 700,395 790,320 880,285 980,250 1100,205"
    fill="none" stroke="#06B6D4" stroke-width="2.5"
    stroke-linecap="round" stroke-linejoin="round" opacity="0.045"/>
  <!-- Tiny dot highlights on the sparkline -->
  <circle cx="700" cy="395" r="4" fill="#06B6D4" opacity="0.07"/>
  <circle cx="880" cy="285" r="4" fill="#3B82F6" opacity="0.07"/>
  <circle cx="1100" cy="205" r="5" fill="#06B6D4" opacity="0.09"/>

  <!-- ─── APP ICON CARD ─── -->
  <!-- Icon card: 300 × 300, centered vertically in 480px section -->
  <!-- Positioned: x=80, y=90  (center: 230, 240) -->

  <!-- Outer glow blob behind card -->
  <rect x="80" y="90" width="300" height="300" rx="68"
        fill="#3B82F6" opacity="0.09" filter="url(#ambientGlow)"/>

  <!-- Icon card surface -->
  <rect x="80" y="90" width="300" height="300" rx="68"
        fill="#161B22" filter="url(#cardShadow)"/>

  <!-- Icon card border: 1px gradient stroke for premium finish -->
  <rect x="80" y="90" width="300" height="300" rx="68"
        fill="none" stroke="url(#brandGrad)" stroke-width="1.2" opacity="0.28"/>

  <!-- Top-inner glow wash (like a subtle screen shine) -->
  <ellipse cx="230" cy="118" rx="90" ry="28"
           fill="#3B82F6" opacity="0.07"/>

  <!-- ─── P MARK ─── -->
  <!--
    Geometry:
      Icon center: (230, 240)
      Path spine x: 196
      P bounding box: x=176–306, y=130–350 (center 241,240 ≈ 230,240)
      Stem: y=350 → y=130 (height=220)
      Bowl arc: from (196,130) A 75,75 → (196,280) [semicircle, radius=75]
      Stroke-width: 40px → half=20
      P left edge: 196-20=176, P right outer: 196+75+20=291
      Bowl inner right: 196+75-20=251, Stem right: 196+20=216
      Visible counter width: 251-216=35px ← clear, readable P letter
      Vertical center: (130+350)/2=240 ✓
      Horizontal center: (176+291)/2=233.5 ≈ 230 ✓
  -->

  <!-- Glow behind P (wider stroke, blurred) -->
  <path d="M 196,350 L 196,130 A 75,75 0 0,1 196,280"
        fill="none" stroke="#3B82F6" stroke-width="70"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.12" filter="url(#markGlow)"/>

  <!-- The P mark: single bold-stroke path -->
  <path d="M 196,350 L 196,130 A 75,75 0 0,1 196,280"
        fill="none" stroke="url(#brandGrad)" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"/>


  <!-- ─── DIVIDER ─── -->
  <line x1="428" y1="130" x2="428" y2="350"
        stroke="#374151" stroke-width="1" opacity="0.35"/>


  <!-- ─── WORDMARK ─── -->
  <!-- "Paave" — 800 weight, 118px, gradient, tight tracking -->
  <!-- vertical center of icon: y=240, dominant-baseline=middle aligns em-box center to y -->
  <text x="468" y="245"
        font-size="118" font-weight="800"
        fill="url(#wordGradDark)"
        dominant-baseline="middle"
        letter-spacing="-5">Paave</text>

  <!-- Tagline -->
  <text x="471" y="308"
        font-size="14" font-weight="500"
        fill="#6B7280" letter-spacing="5.5">INVEST · LEARN · GROW</text>

  <!-- Brand palette row -->
  <text x="471" y="368"
        font-size="9.5" font-weight="500"
        fill="#374151" letter-spacing="3">BRAND PALETTE</text>

  <!-- Swatch: Electric Blue -->
  <circle cx="486" cy="398" r="13" fill="#3B82F6"/>
  <text x="478" y="421" font-size="8.5" font-family="monospace" fill="#4B5563">#3B82F6</text>

  <!-- Swatch: Cyan -->
  <circle cx="534" cy="398" r="13" fill="#06B6D4"/>
  <text x="526" y="421" font-size="8.5" font-family="monospace" fill="#4B5563">#06B6D4</text>

  <!-- Swatch: Emerald (growth / positive P&L) -->
  <circle cx="582" cy="398" r="13" fill="#10B981"/>
  <text x="574" y="421" font-size="8.5" font-family="monospace" fill="#4B5563">#10B981</text>

  <!-- Swatch: Navy (background) -->
  <circle cx="630" cy="398" r="13" fill="#0D1117" stroke="#374151" stroke-width="1"/>
  <text x="622" y="421" font-size="8.5" font-family="monospace" fill="#4B5563">#0D1117</text>

  <!-- Swatch: Warning / Amber -->
  <circle cx="678" cy="398" r="13" fill="#F59E0B"/>
  <text x="670" y="421" font-size="8.5" font-family="monospace" fill="#4B5563">#F59E0B</text>


  <!-- ════════════════════════════════════════════════════════════════ -->
  <!--  SECTION B — STANDALONE APP ICON (2× display)                   -->
  <!--  Canvas: right portion of A-section                             -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Floating label -->
  <text x="940" y="128"
        font-size="10" font-weight="500" fill="#4B5563" letter-spacing="2.5">APP ICON</text>

  <!-- Icon: 200×200 at (940, 140) → center (1040, 240) -->
  <rect x="940" y="140" width="200" height="200" rx="44"
        fill="#3B82F6" opacity="0.07" filter="url(#ambientGlow)"/>
  <rect x="940" y="140" width="200" height="200" rx="44"
        fill="#161B22" filter="url(#cardShadow)"/>
  <rect x="940" y="140" width="200" height="200" rx="44"
        fill="none" stroke="url(#brandGrad)" stroke-width="1" opacity="0.25"/>
  <ellipse cx="1040" cy="162" rx="60" ry="20" fill="#3B82F6" opacity="0.06"/>

  <!-- P mark inside small icon (scaled to 200×200, center 1040,240) -->
  <!--
    Scale factor: ~0.65 of the original 300×300 icon mark
    Original path spine: x=196, center=(230,240), icon at (80,90)
    For 200×200 icon at (940,140), center=(1040,240):
    Offset from original center to new center: dx=(1040-230)=810, dy=0
    Original spine x=196 → new spine x=196+810=1006 → approx 1006
    But need to scale the geometry too: 200/300 ≈ 0.667
    Scaled values (from icon center):
      spine x offset from center: 196-230=-34 → *0.667=-22.7 → 1040-23=1017
      Stem height: 220*0.667=147 → y from 240-73.5=166.5 to 240+73.5=313.5
      Bowl height: 150*0.667=100 → y from 166.5 to 166.5+100=266.5
      Bowl radius: 75*0.667=50
      Stroke: 40*0.667=27
  -->
  <!-- P mark glow (small icon) -->
  <path d="M 1017,314 L 1017,167 A 50,50 0 0,1 1017,267"
        fill="none" stroke="#3B82F6" stroke-width="48"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.12" filter="url(#markGlow)"/>
  <!-- P mark (small icon) -->
  <path d="M 1017,314 L 1017,167 A 50,50 0 0,1 1017,267"
        fill="none" stroke="url(#brandGrad)" stroke-width="27"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Label below small icon -->
  <text x="990" y="360"
        font-size="10" font-weight="400" fill="#4B5563" letter-spacing="1">48 × 48 · 1024 × 1024</text>


  <!-- Section divider between A and C -->
  <line x1="0" y1="480" x2="1200" y2="480" stroke="#1F2937" stroke-width="1"/>


  <!-- ════════════════════════════════════════════════════════════════ -->
  <!--  SECTION C — LIGHT BACKGROUND LOCKUP                            -->
  <!--  Canvas: 1200 × 240 (y=480–720)                                 -->
  <!-- ════════════════════════════════════════════════════════════════ -->

  <!-- Light background -->
  <rect x="0" y="480" width="1200" height="240" fill="#F8FAFC"/>

  <!-- Section label -->
  <text x="80" y="510"
        font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="2.5">LIGHT BACKGROUND USAGE</text>

  <!-- ─── Small icon (light version) ─── -->
  <!-- 140×140 at (80, 525) → center (150, 595) -->
  <rect x="80" y="525" width="140" height="140" rx="32"
        fill="#FFFFFF" filter="url(#lightShadow)"/>
  <rect x="80" y="525" width="140" height="140" rx="32"
        fill="none" stroke="#E5E7EB" stroke-width="1"/>

  <!-- P mark (light icon, center 150,595) -->
  <!--
    Scaled to 140px icon:
    Scale: 140/300=0.467
    spine offset: -34*0.467=-15.9 → center_x-16=134
    stem height: 220*0.467=103 → y: 595-51.5=543.5 to 595+51.5=646.5
    bowl height: 150*0.467=70 → bottom at 543.5+70=613.5
    bowl radius: 75*0.467=35
    stroke: 40*0.467=19 → round to 18
  -->
  <path d="M 134,647 L 134,544 A 35,35 0 0,1 134,614"
        fill="none" stroke="url(#brandGradLight)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ─── Wordmark (light) ─── -->
  <text x="248" y="597"
        font-size="80" font-weight="800"
        fill="url(#wordGradLight)"
        dominant-baseline="middle"
        letter-spacing="-3">Paave</text>

  <text x="250" y="645"
        font-size="12" font-weight="500"
        fill="#9CA3AF" letter-spacing="4.5">INVEST · LEARN · GROW</text>


  <!-- ─── Minimum size indicator ─── -->
  <!-- Show logo at minimum readable size -->
  <text x="820" y="510"
        font-size="10" font-weight="500" fill="#9CA3AF" letter-spacing="2.5">MINIMUM SIZE</text>

  <!-- Tiny icon: 32×32 -->
  <rect x="820" y="524" width="32" height="32" rx="7"
        fill="#161B22"/>
  <!-- P at 32px: spine at ~828, stroke ~9 -->
  <path d="M 828,549 L 828,530 A 9,9 0 0,1 828,548"
        fill="none" stroke="url(#brandGrad)" stroke-width="9"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="570"
        font-size="9" fill="#9CA3AF">32px icon</text>

  <!-- Small icon: 48×48 -->
  <rect x="870" y="518" width="48" height="48" rx="11"
        fill="#161B22"/>
  <path d="M 882,558 L 882,526 A 14,14 0 0,1 882,554"
        fill="none" stroke="url(#brandGrad)" stroke-width="12"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="868" y="576"
        font-size="9" fill="#9CA3AF">48px icon</text>

  <!-- Medium icon: 80×80 -->
  <rect x="932" y="510" width="80" height="80" rx="18"
        fill="#161B22"/>
  <path d="M 952,580 L 952,522 A 23,23 0 0,1 952,568"
        fill="none" stroke="url(#brandGrad)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="940" y="602"
        font-size="9" fill="#9CA3AF">80px icon</text>

  <!-- 1px spacing note / fine print -->
  <text x="820" y="650"
        font-size="10" fill="#D1D5DB" letter-spacing="0.5">
    Do not scale below 24px. Maintain 1:1 icon aspect ratio. Gradient direction: 135°.
  </text>
  <text x="820" y="665"
        font-size="10" fill="#D1D5DB" letter-spacing="0.5">
    Clear space = ½ icon height on all sides. Never recolor or rotate the mark.
  </text>

</svg>
