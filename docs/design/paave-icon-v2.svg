<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paave — App Icon, Style 2 "The Chevron"
  Size: 512 × 512 (scale to any icon size)
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#0D1117"/>

  <!-- Subtle top-inner glow -->
  <ellipse cx="256" cy="90" rx="130" ry="42" fill="#06B6D4" opacity="0.07"/>

  <!-- Chevron — soft glow layers -->
  <rect x="97" y="151" width="318" height="84" rx="42"
        fill="#3B82F6" opacity="0.12" filter="url(#glow)"
        transform="rotate(-9, 256, 193)"/>
  <rect x="97" y="277" width="318" height="84" rx="42"
        fill="#06B6D4" opacity="0.12" filter="url(#glow)"
        transform="rotate(9, 256, 319)"/>

  <!-- Chevron — main marks -->
  <!--
    Geometry (512 × 512 icon, center 256,256):
      Each pill: 318 × 84, rx=42
      Top pill center:    (256, 193)  rotated −9°
      Bottom pill center: (256, 319)  rotated +9°
      Gap analysis (sin 9°=0.156, lever arm=159px, shift=24.8px):
        Left gap:  91.6 px — wide open
        Right gap: −7.6 px — pills merge at tip (smooth join)
  -->
  <!-- Top pill -->
  <rect x="97" y="151" width="318" height="84" rx="42"
        fill="url(#g)"
        transform="rotate(-9, 256, 193)"/>

  <!-- Bottom pill -->
  <rect x="97" y="277" width="318" height="84" rx="42"
        fill="url(#g)"
        transform="rotate(9, 256, 319)"/>
</svg>
