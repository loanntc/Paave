<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paave — Horizontal Logo Lockup, Style 1 "The Pave Mark"
  Canvas: 640 × 200  (dark background, primary usage)
-->
<svg width="640" height="200" viewBox="0 0 640 200"
     xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Icon mark gradient -->
    <linearGradient id="markGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wordmark gradient (userSpaceOnUse — spans the text x range) -->
    <linearGradient id="wordGrad" x1="200" y1="0" x2="560" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Ambient glow -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="14"/>
    </filter>

    <!-- Icon shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14"
                    flood-color="#3B82F6" flood-opacity="0.20"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="640" height="200" fill="#0D1117"/>

  <!-- ── ICON (160 × 160, positioned at 20,20) ── -->
  <!-- Glow blob -->
  <rect x="20" y="20" width="160" height="160" rx="36"
        fill="#3B82F6" opacity="0.07" filter="url(#glow)"/>

  <!-- Icon card -->
  <rect x="20" y="20" width="160" height="160" rx="36"
        fill="#161B22" filter="url(#shadow)"/>
  <rect x="20" y="20" width="160" height="160" rx="36"
        fill="none" stroke="url(#markGrad)" stroke-width="1" opacity="0.25"/>

  <!-- P mark (scaled for 160 × 160 icon, center 100,100)
       Spine x = 80
       Stroke = 22px  (half = 11)
       Bowl radius = 41px
       Stem: y = 47 → 153  (height 106)
       Bowl: y = 47 → 128  (height 81, radius 40.5 ≈ 41 — semicircle)
       Counter: 41 − 11 = 30 px
  -->
  <!-- P glow -->
  <path d="M 80,153 L 80,47 A 41,41 0 0,1 80,128"
        fill="none" stroke="#3B82F6" stroke-width="40"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.12" filter="url(#glow)"/>
  <!-- P mark -->
  <path d="M 80,153 L 80,47 A 41,41 0 0,1 80,128"
        fill="none" stroke="url(#markGrad)" stroke-width="22"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── DIVIDER ── -->
  <line x1="198" y1="40" x2="198" y2="160"
        stroke="#374151" stroke-width="1" opacity="0.35"/>

  <!-- ── WORDMARK ── -->
  <text x="218" y="100"
        font-size="80" font-weight="800"
        fill="url(#wordGrad)"
        dominant-baseline="middle"
        letter-spacing="-3">Paave</text>

  <!-- ── TAGLINE ── -->
  <text x="220" y="148"
        font-size="11.5" font-weight="500"
        fill="#6B7280" letter-spacing="5">INVEST · LEARN · GROW</text>
</svg>
