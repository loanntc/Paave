<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paave — App Icon, Style 1 "The Pave Mark"
  Size: 512 × 512 (scale to any icon size)
-->
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="114" fill="#0D1117"/>

  <!-- Subtle top-inner glow -->
  <ellipse cx="256" cy="90" rx="130" ry="42" fill="#3B82F6" opacity="0.07"/>

  <!-- P mark — soft glow layer -->
  <path d="M 191,426 L 191,86 A 130,130 0 0,1 191,346"
        fill="none" stroke="#3B82F6" stroke-width="120"
        stroke-linecap="round" stroke-linejoin="round"
        opacity="0.09" filter="url(#glow)"/>

  <!-- P mark — main -->
  <!--
    Geometry (512 × 512 icon, center 256,256):
      Spine x = 191  →  P center x = (191-36 + 191+130+36)/2 = (155+357)/2 = 256 ✓
      Stem: y = 86 → 426  (height 340, caps add ±36 → visual: 50–462)
      Bowl: y = 86 → 346  (height 260, radius 130 — perfect semicircle)
      Stroke: 72px  (half = 36)
      Counter width (visible P hole): 130 − 36 = 94 px ← clear, legible P
  -->
  <path d="M 191,426 L 191,86 A 130,130 0 0,1 191,346"
        fill="none" stroke="url(#g)" stroke-width="72"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
