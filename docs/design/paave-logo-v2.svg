<?xml version="1.0" encoding="UTF-8"?>
<!--
  Paave — Horizontal Logo Lockup, Style 2 "The Chevron"
  Canvas: 640 × 200  (dark background, primary usage)
-->
<svg width="640" height="200" viewBox="0 0 640 200"
     xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <!-- Pill gradient -->
    <linearGradient id="pillGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Wordmark gradient -->
    <linearGradient id="wordGrad" x1="200" y1="0" x2="580" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12"/>
    </filter>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14"
                    flood-color="#06B6D4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Dark background -->
  <rect width="640" height="200" fill="#0D1117"/>

  <!-- ── ICON (160 × 160, positioned at 20,20) ── -->
  <rect x="20" y="20" width="160" height="160" rx="36"
        fill="#06B6D4" opacity="0.06" filter="url(#glow)"/>
  <rect x="20" y="20" width="160" height="160" rx="36"
        fill="#161B22" filter="url(#shadow)"/>
  <rect x="20" y="20" width="160" height="160" rx="36"
        fill="none" stroke="#06B6D4" stroke-width="1" opacity="0.20"/>

  <!-- Chevron mark (scaled for 160 × 160 icon, center 100,100)
       Scale: 160/512 = 0.3125
       Top pill:    w=99, h=26, rx=13 — center (100, 80)  rotate(−9°, 100, 80)
       Bottom pill: w=99, h=26, rx=13 — center (100, 120) rotate(+9°, 100, 120)
       Left gap:  ~29 px — open
       Right tip: ~2 px overlap — pills merge at tip
  -->
  <!-- Glow layers -->
  <rect x="50.5" y="67" width="99" height="26" rx="13"
        fill="#3B82F6" opacity="0.18" filter="url(#glow)"
        transform="rotate(-9, 100, 80)"/>
  <rect x="50.5" y="107" width="99" height="26" rx="13"
        fill="#06B6D4" opacity="0.18" filter="url(#glow)"
        transform="rotate(9, 100, 120)"/>
  <!-- Top pill -->
  <rect x="50.5" y="67" width="99" height="26" rx="13"
        fill="url(#pillGrad)"
        transform="rotate(-9, 100, 80)"/>
  <!-- Bottom pill -->
  <rect x="50.5" y="107" width="99" height="26" rx="13"
        fill="url(#pillGrad)"
        transform="rotate(9, 100, 120)"/>

  <!-- ── DIVIDER ── -->
  <line x1="198" y1="40" x2="198" y2="160"
        stroke="#374151" stroke-width="1" opacity="0.35"/>

  <!-- ── WORDMARK ("paave" lowercase — more casual, Gen Z) ── -->
  <text x="218" y="100"
        font-size="80" font-weight="700"
        fill="url(#wordGrad)"
        dominant-baseline="middle"
        letter-spacing="-1">paave</text>

  <!-- ── TAGLINE ── -->
  <text x="220" y="150"
        font-size="11.5" font-weight="500"
        fill="#6B7280" letter-spacing="5">PAVE YOUR WAY FORWARD</text>
</svg>
