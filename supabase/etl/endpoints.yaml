    auth: system_token

  - key: market.liquidity
    upstream: /api/v1/market/liquidity
    target_table: market_liquidity_snapshot
    conflict_cols: []
    transform: transforms.liquidity
    schedule: hourly
    auth: system_token

  - key: market.price_board
