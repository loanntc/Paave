# ============================================================================
# Paave API  →  Supabase  ingestion mapping
# ============================================================================
# This file is the single source of truth for what the ETL worker does.
# Each entry maps ONE Paave upstream endpoint to ONE Supabase table.
#
# Fields:
#   key              unique identifier (used in logs, dead-letter queue)
#   upstream         relative path on Paave API (base_url configured via env)
#   method           GET (we only ingest reads)
#   params           query params. Placeholders:
#                      {date}, {date_minus_1}, {date_minus_5}, {ts}, {ts_minus_2h}
#                    For per_symbol endpoints: {symbol}  (loop-resolved)
#                    For per_index  endpoints: {index}   (loop-resolved)
#                    For per_module endpoints: {module}  (loop-resolved)
#   target_table     destination in Supabase
#   conflict_cols    PK/unique cols for upsert (uses PostgREST on_conflict).
#                    [] = append-only.
#   transform        python dotted-path to a transformer fn in transforms.py
#   schedule         hourly | daily | per_symbol | per_index | per_module | on_demand
#   auth             none | system_token
# ============================================================================

endpoints:

  # ==========================================================================
  # MARKET — LIST / MARKET-WIDE (hourly / daily)
  # ==========================================================================
  - key: market.symbols_master
    upstream: /api/v1/market/symbol
    target_table: symbols
    conflict_cols: [code]
    transform: transforms.symbols
    schedule: daily
    auth: system_token

  - key: market.quote_latest
    upstream: /api/v1/market/symbol/latest
    target_table: symbol_quotes_latest
    conflict_cols: [symbol_code]
    transform: transforms.quote_latest
    schedule: hourly
    auth: system_token

  - key: market.day_bars
    upstream: /api/v1/market/candles
    params: { resolution: "D", from: "{date_minus_5}", to: "{date}" }
    target_table: symbol_day_bars
    conflict_cols: [symbol_code, trade_date]
    transform: transforms.day_bars
    schedule: daily
    auth: system_token

  - key: market.session_status
    upstream: /api/v1/market/session-status
    target_table: market_session_status
    conflict_cols: [exchange]
    transform: transforms.session_status
    schedule: hourly
    auth: system_token

  - key: market.index_list
    upstream: /api/v1/market/index/list
    target_table: indices
    conflict_cols: [code]
    transform: transforms.indices
    schedule: daily
    auth: system_token

  - key: market.current_dividends
    upstream: /api/v1/market/current-dividend-event
    target_table: dividend_events
    conflict_cols: [symbol_code, ex_date, event_type]
    transform: transforms.dividend_events
    schedule: daily
    auth: system_token

  - key: market.daily_returns
    upstream: /api/v1/market/daily-returns
    target_table: symbol_daily_returns
    conflict_cols: [symbol_code, trade_date]
